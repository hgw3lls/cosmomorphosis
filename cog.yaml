build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
  python_packages:
    - "diffusers==0.31.0"
    - "transformers==4.44.2"
    - "accelerate==0.34.2"
    - "safetensors==0.4.5"
    - "sentencepiece==0.1.99"
    - "huggingface-hub==0.26.2"
    - "opencv-python==4.10.0.84"
    - "av==12.1.0"
    - "xformers==0.0.26.post1"

  run:
    - "pip install --upgrade --no-cache-dir torch==2.1.2+cu121 torchvision==0.16.2+cu121 torchaudio==2.1.2+cu121 --index-url https://download.pytorch.org/whl/cu121"

predict: "predict.py:Predictor"
image: "r8.im/andreasjansson/tile-morph"
